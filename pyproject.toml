[project]
name = "mentor"
version = "0.1.0"
description = "Agentic learning mentor: concept graph + mastery model over an Obsidian vault"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mentor = "mentor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mentor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
